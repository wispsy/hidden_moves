name: Publish Hidden Moves to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: hidden-moves-pypi-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify selected distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      package: ${{ steps.release.outputs.package }}
      environment: ${{ steps.release.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
          fetch-depth: 0
      - run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Select package and verify release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/check_release.py --tag "$RELEASE_TAG" --output "$GITHUB_OUTPUT"
      - name: Install build tools
        run: python -m pip install 'uv==0.12.19' twine
      - name: Build selected wheel and source distribution
        env:
          PACKAGE_DIRECTORY: ${{ steps.release.outputs.package_directory }}
        run: uv build "$PACKAGE_DIRECTORY" --out-dir dist
      - name: Check distribution metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python scripts/check_release.py --tag "$RELEASE_TAG" --check dist --receipt-file release-artifacts.json
          python -m twine check --strict dist/*
      - name: Verify installed wheel and public interfaces
        shell: bash
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
          PACKAGE_DIRECTORY: ${{ steps.release.outputs.package_directory }}
        run: |
          test_venv="${RUNNER_TEMP}/selected-wheel"
          uv venv "$test_venv" --python 3.13
          uv pip install --python "$test_venv/bin/python" dist/*.whl
          uv pip check --python "$test_venv/bin/python"
          case "$PACKAGE" in
            hidden-moves)
              "$test_venv/bin/python" -m unittest discover -s tests -v
              "$test_venv/bin/hidden-moves" --help
              "$test_venv/bin/hm" moves list --json
              "$test_venv/bin/python" -I -m hidden_moves moves list --json
              ;;
            hidden-moves-mcp)
              uv build ./examples/text-plugin --out-dir "${RUNNER_TEMP}/text-provider"
              uv pip install --python "$test_venv/bin/python" "${RUNNER_TEMP}/text-provider/"*.whl
              "$test_venv/bin/python" -m unittest discover -s "$PACKAGE_DIRECTORY/tests" -v
              "$test_venv/bin/hidden-moves-mcp" --help
              "$test_venv/bin/python" -I -c "import hidden_moves_mcp"
              ;;
            hidden-moves-openai)
              uv build ./examples/text-plugin --out-dir "${RUNNER_TEMP}/text-provider"
              uv pip install --python "$test_venv/bin/python" "${RUNNER_TEMP}/text-provider/"*.whl
              "$test_venv/bin/python" -m unittest discover -s "$PACKAGE_DIRECTORY/tests" -v
              "$test_venv/bin/python" -I -c "import hidden_moves_openai"
              ;;
            hidden-moves-github-projects)
              "$test_venv/bin/python" -I - <<'PY'
          import sys
          from importlib.metadata import distribution
          import hidden_moves_github_projects
          project = distribution('hidden-moves-github-projects')
          assert all('extra ==' in requirement for requirement in (project.requires or []))
          assert 'hidden_moves' not in sys.modules
          assert 'backpack_store' not in sys.modules
          PY
              "$test_venv/bin/python" -m unittest discover -s "$PACKAGE_DIRECTORY/tests" -p test_client.py -v
              uv pip install --python "$test_venv/bin/python" \
                'hidden-moves-mcp>=0.1,<0.2' 'hidden-moves-openai>=0.1,<0.2' 'backpack-store==0.2.0'
              uv pip check --python "$test_venv/bin/python"
              "$test_venv/bin/python" -m unittest discover -s "$PACKAGE_DIRECTORY/tests" -v
              "$test_venv/bin/python" -m unittest discover -s "$PACKAGE_DIRECTORY/write_tests" -v
              "$test_venv/bin/python" -m unittest discover -s "$PACKAGE_DIRECTORY/snapshot_tests" -v
              "$test_venv/bin/hidden-moves-github-projects" --help
              "$test_venv/bin/hidden-moves-github-projects-write" --help
              "$test_venv/bin/python" examples/projects_snapshot_demo.py
              ;;
            hidden-moves-workspace)
              "$test_venv/bin/python" -m unittest discover -s "$PACKAGE_DIRECTORY/tests" -v
              "$test_venv/bin/python" -I -c "import hidden_moves_workspace"
              uv pip install --python "$test_venv/bin/python" 'hidden-moves>=0.1.1,<0.2' 'hidden-moves-mcp>=0.1,<0.2'
              "$test_venv/bin/python" -m unittest discover -s "$PACKAGE_DIRECTORY/integration_tests" -v
              "$test_venv/bin/hidden-moves-workspace" --help
              ;;
            *) exit 1 ;;
          esac
      - name: Verify selected source installation
        shell: bash
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
          PACKAGE_DIRECTORY: ${{ steps.release.outputs.package_directory }}
        run: |
          source_venv="${RUNNER_TEMP}/selected-source"
          uv venv "$source_venv" --python 3.13
          uv pip install --python "$source_venv/bin/python" dist/*.tar.gz
          uv pip check --python "$source_venv/bin/python"
          if [ "$PACKAGE" = hidden-moves ]; then
            "$source_venv/bin/python" -m unittest discover -s tests -v
            "$source_venv/bin/hidden-moves" --help
          else
            "$source_venv/bin/python" -m unittest discover -s "$PACKAGE_DIRECTORY/tests" -p test_client.py -v
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-receipt
          path: release-artifacts.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.release.outputs.package }}-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish selected distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.build.outputs.environment }}
      url: https://pypi.org/project/${{ needs.build.outputs.package }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.build.outputs.package }}-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
